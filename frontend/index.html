<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Prénoms</title>
    <meta
      name="description"
      content="Choisissez le prénom de votre enfant à deux : chacun trie de son côté, puis vous départagez la liste commune."
    />
    <!-- Matches --paper in app.css, so the browser chrome does not fight the page. -->
    <meta name="theme-color" content="#fbfaf8" />

    <!-- A Session link is sent from one parent to the other, usually in a
         messaging app, so the preview card is part of the product. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prénoms" />
    <meta property="og:title" content="Prénoms" />
    <meta
      property="og:description"
      content="Choisissez le prénom de votre enfant à deux : chacun trie de son côté, puis vous départagez la liste commune."
    />
    <meta property="og:url" content="https://quelprenom.xyz/" />
    <meta property="og:locale" content="fr_FR" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
