<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- pixel-art cat, 16x16 grid -->
  <g fill="#3b2412">
    <!-- silhouette / outline -->
    <rect x="3" y="1" width="2" height="1" /><rect x="11" y="1" width="2" height="1" />
    <rect x="3" y="2" width="3" height="1" /><rect x="10" y="2" width="3" height="1" />
    <rect x="3" y="3" width="4" height="1" /><rect x="9" y="3" width="4" height="1" />
    <rect x="3" y="4" width="10" height="9" />
    <rect x="4" y="13" width="8" height="1" />
    <!-- whiskers -->
    <rect x="1" y="8" width="2" height="1" /><rect x="13" y="8" width="2" height="1" />
    <rect x="1" y="10" width="2" height="1" /><rect x="13" y="10" width="2" height="1" />
  </g>
  <g fill="#f4a03c">
    <!-- fur -->
    <rect x="4" y="2" width="1" height="1" /><rect x="11" y="2" width="1" height="1" />
    <rect x="4" y="3" width="2" height="1" /><rect x="10" y="3" width="2" height="1" />
    <rect x="4" y="4" width="8" height="8" />
    <rect x="5" y="12" width="6" height="1" />
  </g>
  <g fill="#d97b1f">
    <!-- tabby stripes -->
    <rect x="6" y="4" width="1" height="2" /><rect x="9" y="4" width="1" height="2" />
  </g>
  <g fill="#f2807f">
    <!-- inner ears + nose -->
    <rect x="4" y="3" width="1" height="1" /><rect x="11" y="3" width="1" height="1" />
    <rect x="7" y="9" width="2" height="1" />
  </g>
  <g fill="#4bd06a">
    <!-- eyes -->
    <rect x="5" y="6" width="2" height="2" /><rect x="9" y="6" width="2" height="2" />
  </g>
  <g fill="#3b2412">
    <!-- pupils + mouth -->
    <rect x="6" y="6" width="1" height="2" /><rect x="9" y="6" width="1" height="2" />
    <rect x="6" y="10" width="1" height="1" /><rect x="9" y="10" width="1" height="1" />
    <rect x="7" y="11" width="2" height="1" />
  </g>
</svg>
